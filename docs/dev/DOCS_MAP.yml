# SMKD Documentation Mapping Rules
# Maps source code directories to required documentation and verification checks

rules:
  - source: "stock-signal-bot/backend/app/api/**"
    docs:
      - "docs/dev/CODEBASE_MAP.md"
      - "docs/dev/ARCHITECTURE.md"
    checks:
      - "python -m unittest stock-signal-bot/backend/app/tests/test_trading_correctness.py"

  - source: "stock-signal-bot/backend/app/departments/market_data/**"
    docs:
      - "docs/dev/CODEBASE_MAP.md"
    checks:
      - "python -m unittest stock-signal-bot/backend/app/tests/test_provider_replay.py"

  - source: "fast-framework/packages/stock-bot-ui/src/components/**"
    docs:
      - "docs/dev/CODEBASE_MAP.md"
    checks:
      - "pnpm -C fast-framework exec vitest run src/tests/ui_quality_pass.test.ts"
      - "pnpm -C fast-framework/packages/stock-bot-ui build"

  - source: "fast-framework/packages/stock-bot-ui/src/departments/**"
    docs:
      - "docs/dev/CODEBASE_MAP.md"
    checks:
      - "pnpm -C fast-framework test"

  - source: "fast-framework/packages/stock-bot-ui/package.json"
    docs:
      - "docs/dev/START_HERE.md"
    checks:
      - "pnpm -C fast-framework/packages/stock-bot-ui build"

  - source: "scripts/dev/**"
    docs:
      - "docs/dev/START_HERE.md"
      - "docs/dev/STATUS.md"
    checks:
      - "powershell -File scripts/dev/devctl.ps1 doctor"
